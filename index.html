<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合租公費與驗算系統</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .controls label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .controls select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            min-width: 150px;
            cursor: pointer;
        }
        .controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            text-align: center;
        }
        th {
            background-color: #f1f1f1;
            font-weight: bold;
        }
        .diff-ok {
            color: #28a745;
            font-weight: bold;
        }
        .diff-warn {
            color: #dc3545;
            font-weight: bold;
        }
        #loading {
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.2rem;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>公費結算與驗算系統</h1>
    
    <div class="controls">
        <label for="monthSelect">選擇查看
