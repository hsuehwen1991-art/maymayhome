<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐈 MayMayHome公費結算系統</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* 全新橫幅 Banner 樣式設計 */
        .banner-container {
            width: 100%;
            height: 350px; /* 橫幅高度，可自行依喜好微調 */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 確保照片滿版且不拉伸變形 */
            object-position: center 35%; /* 自動微調垂直對齊中心點 */
        }
        
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 15px 0 25px 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .controls label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .controls select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            min-width: 150px;
            cursor: pointer;
        }
        .controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            text-align: center;
        }
        th {
            background-color: #f1f1f1;
            font-weight: bold;
        }
        .total-amount {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.15rem;
        }
        #loading {
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.2rem;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="banner-container">
        <img src="littlemaymay.png" alt="MayMay Banner" class="banner-img">
    </div>
    
    <h1>🐈 MayMayHome公費結算系統</h1>
    
    <div class="controls">
        <label for="monthSelect">選擇查看月份：</label>
        <select id="monthSelect" onchange="fetchData()"></select>
        <button onclick="fetchData()">重新整理</button>
    </div>

    <div id="loading">讀取與計算中，請稍候...</div>

    <div id="output" style="display: none;">
        <div class="card">
            <h2>這個月支出明細</h2>
            <div id="expensesTable"></div>
        </div>

        <div class="card">
            <h2>成員本月結算明細</h2>
            <div id="membersTable"></div>
        </div>
    </div>
</div>

<script>
    // 固定的 Google 試算表 ID
    const SPREADSHEET_ID = '13EYAH1ynGnraSEvDLZ0vo8YWsbvtntf0OHU5iCuTLWE';

    // 初始化月份下拉選單 (產生最近24個月的選項)
    function initMonths() {
        const select = document.getElementById('monthSelect');
        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() + 1;

        for (let i = 0; i < 24; i++) {
            const option = document.createElement('option');
            const val = `${year}.${month}`;
            option.value = val;
            option.textContent = `${year} 年 ${month} 月 (${val})`;
            select.appendChild(option);

            month--;
            if (month === 0) {
                month = 12;
                year--;
            }
        }

        // 自動加載最新月份的資料
        fetchData();
    }

    // CSV 解析器
    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        return lines.map(line => {
            const row = [];
            let curr = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        curr += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(curr.trim());
                    curr = '';
                } else {
                    curr += char;
                }
            }
            row.push(curr.trim());
            return row;
        });
    }

    async function fetchData() {
        const sheetName = document.getElementById('monthSelect').value;
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('output').style.display = 'none';

        // 使用 Google viz API 抓取 CSV
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("網路請求失敗，請確認雲端試算表共用權限是否已開啟。");
            const csvText = await response.text();
            
            if (csvText.toLowerCase().includes("<html")) {
                throw new Error(`找不到 [${sheetName}] 的資料。請確認試算表中是否存在此分頁，且共用權限已設定為「知道連結的使用者皆可查看」。`);
            }

            processCSV(csvText);
        } catch (error) {
            alert(error.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function processCSV(csvText) {
        const rows = parseCSV(csvText);
        
        let expenses = [];
        let totalShared = 0;
        let totalElec = 0;
        let advMap = {};
        
        let members = [];
        let sumDays = 0;
        let sumElecDays = 0;

        for (let i = 1; i < rows.length; i++) {
            let row = rows[i];
            if (!row || row.join('') === '') continue;

            // ---
