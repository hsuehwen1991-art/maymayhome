<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🐈 MayMayHome 家庭首頁</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/maymay-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page-container">
  <!-- 首頁貓咪漸層歡迎卡 -->
  <section class="hero-welcome">
    <img src="assets/maymay-banner.jpg" alt="MayMay Banner" class="hero-welcome-bg" onerror="this.style.display='none'">
    <div class="hero-welcome-overlay"></div>
    <div class="hero-welcome-content">
      <h1 id="welcomeGreeting">嗨，歡迎回來 👋</h1>
      <p id="welcomeSubtext">正在同步最新家庭資訊...</p>
      <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
        <span id="welcomeRoleBadge" class="badge badge-primary">載入中</span>
        <button class="btn btn-outline btn-sm" id="refreshDashBtn" onclick="loadDashboard(false)">↻ 立即同步</button>
      </div>
    </div>
  </section>

  <!-- 雙核心快覽卡片：瓦斯桶狀態 + 本月公費快覽 -->
  <div class="grid-2">
    <!-- 瓦斯桶即時狀態卡 -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">🔥 瓦斯桶即時狀態</h2>
        <a href="home.html" class="btn btn-ghost btn-sm">歷史紀錄 →</a>
      </div>
      <div id="gasStatusBox">
        <div class="empty-state">讀取瓦斯狀態中...</div>
      </div>
      <div id="gasActionBar" class="hidden" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </section>

    <!-- 本月公費快覽卡 -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">💰 本月公費快覽</h2>
        <a href="finance.html" class="btn btn-ghost btn-sm">完整帳單 →</a>
      </div>
      <div id="financeOverviewBox">
        <div class="empty-state">讀取公費摘要中...</div>
      </div>
    </section>
  </div>
</main>

<!-- 首頁右下角像素貓咪「通知中心」客服專員 -->
<div class="cat-concierge-dock" id="catConciergeDock" aria-label="通知中心">
  <div class="cat-bubble hidden" id="catBubble" onclick="onCatConciergeClick()">
    <span class="cat-bubble-dot"></span>
    <span id="catBubbleText">你有 0 則未讀通知</span>
  </div>
  <button type="button" class="cat-concierge-btn" id="catConciergeBtn" onclick="onCatConciergeClick()" title="開啟通知中心" aria-label="開啟通知中心">
    <div class="cat-sprite" id="catSprite"></div>
  </button>
</div>

<!-- 彈窗：通知中心（整合家庭公告與系統推播紀錄） -->
<div id="ncModal" class="modal-backdrop">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <h3 style="margin:0;">🔔 通知中心</h3>
        <span id="ncUnreadBadge" class="badge badge-danger hidden">0 則未讀</span>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('ncModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="nc-toolbar">
        <button id="openAddAnnBtn" type="button" class="btn btn-primary btn-sm hidden" onclick="openAnnModal()">＋ 發布公告</button>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;">
          <button type="button" class="btn btn-outline btn-sm" id="ncMarkAllBtn" onclick="markAllRead()">✓ 全部已讀</button>
          <button type="button" class="btn btn-ghost btn-sm text-muted" id="ncClearReadBtn" onclick="clearReadNotifications()">🗑️ 清除已讀</button>
        </div>
      </div>
      <div id="ncContentBox">
        <div class="empty-state">讀取通知中心中...</div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline btn-sm" onclick="loadDashboard(false)">↻ 重新整理</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="closeModal('ncModal')">關閉</button>
    </div>
  </div>
</div>

<!-- 彈窗：發布／編輯公告 -->
<div id="annModal" class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="annModalTitle">📢 發布新公告</h3>
      <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('annModal')">✕</button>
    </div>
    <form id="annForm">
      <div class="modal-body">
        <input type="hidden" id="annEditId">
        <div class="form-group">
          <label for="annContent">公告內容</label>
          <textarea id="annContent" class="form-control" required placeholder="請輸入公告內容"></textarea>
        </div>
        <div class="form-group hidden" id="annPriorityGroup">
          <label for="annPriority">重要等級（管理員專屬）</label>
          <select id="annPriority" class="form-control">
            <option value="一般">一般公告</option>
            <option value="置頂">📌 置頂公告</option>
          </select>
        </div>
        <div class="form-group" id="annPushGroup">
          <label class="checkbox-row">
            <input type="checkbox" id="annNotifyPush" checked>
            <span>同步推播通知給全體成員</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('annModal')">取消</button>
        <button type="submit" id="annSubmitBtn" class="btn btn-primary">發布公告</button>
      </div>
    </form>
  </div>
</div>

<!-- 彈窗：切換備用瓦斯桶 -->
<div id="gasSwitchModal" class="modal-backdrop">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header">
      <h3>⚠️ 確認已切換至第 2 桶瓦斯</h3>
      <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('gasSwitchModal')">✕</button>
    </div>
    <form id="gasSwitchForm">
      <div class="modal-body">
        <div class="alert alert-warning">
          按下確認後，系統會記錄您的換桶時間、將家裡狀態轉為<strong>「剩餘 1 桶（無備用）」</strong>，並立即推播提醒全體家人留意叫瓦斯。
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="gasSwitchNote">備註（選填）</label>
          <input id="gasSwitchNote" class="form-control" type="text">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('gasSwitchModal')">取消</button>
        <button type="submit" id="gasSwitchBtn" class="btn btn-warning">確認換桶並通知</button>
      </div>
    </form>
  </div>
</div>

<!-- 彈窗：新瓦斯補滿（支援順便記帳公費） -->
<div id="gasRefillModal" class="modal-backdrop">
  <div class="modal-box" style="max-width:440px;">
    <div class="modal-header">
      <h3>✅ 確認新瓦斯送達（補滿 2 桶）</h3>
      <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('gasRefillModal')">✕</button>
    </div>
    <form id="gasRefillForm">
      <div class="modal-body">
        <div class="form-group">
          <label for="gasRefillNote">備註（選填）</label>
          <input id="gasRefillNote" class="form-control" type="text">
        </div>
        <div class="form-group" style="margin-bottom:0; padding:12px; background:#f8fafc; border-radius:10px; border:1px solid var(--border);">
          <label class="checkbox-row" style="margin-bottom:0;">
            <input type="checkbox" id="gasAddExpenseCheck" onchange="toggleGasExpenseFields()">
            <span><strong>同步計入本月公費支出</strong>（代墊人記為自己）</span>
          </label>
          <div id="gasExpenseFields" class="hidden" style="margin-top:12px;">
            <div class="grid-2" style="gap:10px;">
              <div class="form-group" style="margin-bottom:0;">
                <label for="gasExpenseMonth">所屬月份</label>
                <input id="gasExpenseMonth" class="form-control" type="text" placeholder="YYYY.MM">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label for="gasExpenseAmount">瓦斯費用（元）</label>
                <input id="gasExpenseAmount" class="form-control" type="number" inputmode="numeric" pattern="[0-9]*" min="1" step="1" placeholder="請輸入正整數">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal('gasRefillModal')">取消</button>
        <button type="submit" id="gasRefillBtn" class="btn btn-success">確認補滿 2 桶</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
  let dashData = null;

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  // ==================== 像素貓咪通知客服狀態機 ====================
  const CatConcierge = (() => {
    const POSITIONS = ['0% 0%', '33.3333% 0%', '66.6667% 0%', '100% 0%'];
    let timer = null;
    let subTimers = [];
    let unreadCount = 0;
    let isClicking = false;

    function clearAllTimers() {
      clearTimeout(timer);
      subTimers.forEach(t => clearTimeout(t));
      subTimers = [];
    }

    function setFrame(idx) {
      const sprite = document.getElementById('catSprite');
      if (sprite) sprite.style.backgroundPosition = POSITIONS[idx] || POSITIONS[0];
    }

    function scheduleNext() {
      clearAllTimers();
      if (isClicking) return;

      if (unreadCount > 0) {
        // 有未讀通知：活潑搖尾與舉手招手交替提醒
        const delay = 1300 + Math.floor(Math.random() * 1400);
        timer = setTimeout(() => {
          if (isClicking) return;
          const r = Math.random();
          if (r < 0.52) {
            setFrame(3); // 舉手提醒
            subTimers.push(setTimeout(() => { setFrame(2); }, 420));
            subTimers.push(setTimeout(() => { setFrame(0); scheduleNext(); }, 760));
          } else {
            setFrame(2); // 連搖兩下尾巴
            subTimers.push(setTimeout(() => { setFrame(0); }, 230));
            subTimers.push(setTimeout(() => { setFrame(2); }, 430));
            subTimers.push(setTimeout(() => { setFrame(0); scheduleNext(); }, 680));
          }
        }, delay);
      } else {
        // 無未讀：悠閒坐姿＋隨機眨眼／輕搖尾巴
        const delay = 2200 + Math.floor(Math.random() * 2500);
        timer = setTimeout(() => {
          if (isClicking) return;
          const r = Math.random();
          if (r < 0.42) {
            setFrame(1); // 悠閒眨眼
            subTimers.push(setTimeout(() => { setFrame(0); scheduleNext(); }, 280));
          } else if (r < 0.78) {
            setFrame(2); // 輕搖一次尾巴
            subTimers.push(setTimeout(() => { setFrame(0); scheduleNext(); }, 340));
          } else {
            setFrame(2); // 連搖兩次尾巴
            subTimers.push(setTimeout(() => { setFrame(0); }, 240));
            subTimers.push(setTimeout(() => { setFrame(2); }, 460));
            subTimers.push(setTimeout(() => { setFrame(0); scheduleNext(); }, 720));
          }
        }, delay);
      }
    }

    function setUnread(count) {
      unreadCount = Math.max(0, Number(count) || 0);
      if (window.App && typeof App.syncAppBadge === 'function') {
        App.syncAppBadge(unreadCount);
      }
      const bubble = document.getElementById('catBubble');
      const bubbleText = document.getElementById('catBubbleText');
      if (bubble && bubbleText) {
        if (unreadCount > 0) {
          bubbleText.textContent = `你有 ${unreadCount} 則未讀通知`;
          bubble.classList.remove('hidden');
        } else {
          bubble.classList.add('hidden');
        }
      }
      if (!isClicking) {
        setFrame(0);
        scheduleNext();
      }
    }

    function playClickReaction(onComplete) {
      isClicking = true;
      clearAllTimers();
      setFrame(3); // 舉手冒愛心
      const btn = document.getElementById('catConciergeBtn');
      if (btn) {
        btn.classList.remove('is-bouncing');
        void btn.offsetWidth;
        btn.classList.add('is-bouncing');
      }
      setTimeout(() => {
        isClicking = false;
        setFrame(0);
        scheduleNext();
        if (typeof onComplete === 'function') onComplete();
      }, 280);
    }

    scheduleNext();
    return { setUnread, playClickReaction };
  })();

  function onCatConciergeClick() {
    CatConcierge.playClickReaction(() => {
      renderNotificationCenter();
      document.getElementById('ncModal').classList.add('open');
    });
  }

  // ==================== 歡迎卡與首頁摘要渲染 ====================
  function renderWelcome(user) {
    document.getElementById('welcomeGreeting').textContent = `嗨，${user.displayName} 👋`;
    const isReadOnly = user.status === '待結電費';
    document.getElementById('welcomeSubtext').textContent = isReadOnly
      ? '您目前為「待結電費」唯讀狀態，可檢視公費結算明細。'
      : '歡迎回到 MayMayHome，快速掌握居家動態與本月帳務。';

    const badge = document.getElementById('welcomeRoleBadge');
    badge.textContent = user.role === 'Admin' ? '👑 管理員' : (isReadOnly ? '⚡ 待結電費（唯讀）' : '🏠 家庭成員');
    badge.className = 'badge ' + (user.role === 'Admin' ? 'badge-primary' : (isReadOnly ? 'badge-warning' : 'badge-success'));

    const addAnnBtn = document.getElementById('openAddAnnBtn');
    if (addAnnBtn) {
      addAnnBtn.classList.toggle('hidden', isReadOnly);
    }
  }

  function renderDashboard(data) {
    dashData = data;
    const user = App.getUser();
    const canWrite = user && user.status === '啟用';

    // 1. 瓦斯狀態卡
    const g = data.gasStatus || {};
    const isLow = Number(g.remainingTanks) <= 1;
    document.getElementById('gasStatusBox').innerHTML = `
      <div class="gas-status-panel ${isLow ? 'gas-low' : 'gas-full'}">
        <div>
          <div style="font-size:1.15rem; font-weight:800;">
            ${isLow ? '⚠️ 僅剩 1 桶（已切換備用桶）' : '✅ 2 桶滿載（尚有備用桶）'}
          </div>
          <div style="font-size:0.84rem; margin-top:4px; opacity:0.9;">
            上次紀錄：${App.escapeHtml(g.lastAction || '-')}（${App.escapeHtml(g.lastOperator || '-')} · ${App.escapeHtml(g.lastTime || '-')}）
          </div>
        </div>
        <span class="badge ${isLow ? 'badge-danger' : 'badge-success'}">
          剩餘 ${g.remainingTanks ?? 2} 桶
        </span>
      </div>
      <div class="grid-2" style="gap:10px; margin-bottom:14px;">
        <div class="stat-box">
          <div class="stat-label">距離上次操作</div>
          <div class="stat-value">${g.daysSinceLastSwitch ?? 0} 天</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">單桶平均使用天數</div>
          <div class="stat-value">${g.avgDaysPerTank ? g.avgDaysPerTank + ' 天' : '累計中'}</div>
        </div>
      </div>
    `;

    const gasBar = document.getElementById('gasActionBar');
    if (canWrite) {
      gasBar.classList.remove('hidden');
      gasBar.innerHTML = isLow
        ? `<button class="btn btn-success btn-block" onclick="openGasRefillModal()">✅ 新瓦斯已送達（補滿 2 桶）</button>`
        : `<button class="btn btn-warning btn-block" onclick="openGasSwitchModal()">⚠️ 我已手動切換至第 2 桶</button>`;
    } else {
      gasBar.classList.add('hidden');
    }

    // 2. 本月公費快覽卡
    const f = data.financeOverview;
    if (!f) {
      document.getElementById('financeOverviewBox').innerHTML = `
        <div class="empty-state">
          尚未開立任何月份公費帳務。<br>
          <a href="finance.html" class="btn btn-primary btn-sm" style="margin-top:10px;">前往公費中心</a>
        </div>
      `;
    } else {
      const my = f.mySettlement;
      let myLabel = '本期無帳務';
      let myBadge = '';
      if (my) {
        const isNeg = my.amount < 0;
        const negPrefix = my.isRentPayer ? '應收 ' : '應退款 ';
        myLabel = (isNeg ? negPrefix : '應繳 ') + App.formatMoney(Math.abs(my.amount)) + ' 元';
        const statusCls = (my.paymentStatus === '已繳清' || my.paymentStatus === '已全數收齊') ? 'badge-success'
          : (my.paymentStatus === '待繳款' ? 'badge-danger'
          : ((my.paymentStatus === '待退款' || my.paymentStatus === '待收款') ? 'badge-warning' : 'badge-muted'));
        myBadge = `<span class="badge ${statusCls}">${App.escapeHtml(my.paymentStatus)}</span>`;
      }

      document.getElementById('financeOverviewBox').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
          <div>
            <div style="font-size:1.05rem; font-weight:800;">${App.escapeHtml(App.formatMonth(f.currentMonth))} 帳期</div>
            <div class="text-muted" style="font-size:0.82rem;">結算日：${App.escapeHtml(f.settlementDate)}</div>
          </div>
          <span class="badge badge-primary">對帳進度 ${f.paymentProgress.paidCount} / ${f.paymentProgress.totalCount}</span>
        </div>
        <div class="stat-box" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <div class="stat-label">${my && my.isRentPayer ? '我的本期淨應收' : '我的本期結算'}</div>
            <div class="stat-value ${my && my.amount < 0 ? 'text-success' : 'text-primary'}">${myLabel}</div>
          </div>
          ${myBadge}
        </div>
        <div class="grid-2" style="gap:10px;">
          <div class="stat-box">
            <div class="stat-label">一般公費累計</div>
            <div class="stat-value" style="font-size:1.05rem;">${App.formatMoney(f.totalShared)} 元</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">電費累計</div>
            <div class="stat-value" style="font-size:1.05rem;">${App.formatMoney(f.totalElec)} 元</div>
          </div>
        </div>
      `;
    }

    // 3. 同步更新右下角貓咪未讀數與通知中心彈窗
    const anns = data.announcements || [];
    const notifs = data.notifications || [];
    const computedUnread = anns.filter(a => a.isRead === false).length + notifs.filter(n => !n.read).length;
    const unread = data.unreadCount !== undefined ? data.unreadCount : computedUnread;
    CatConcierge.setUnread(unread);

    if (document.getElementById('ncModal').classList.contains('open')) {
      renderNotificationCenter();
    }
  }

  function renderNotificationCenter() {
    const box = document.getElementById('ncContentBox');
    const badge = document.getElementById('ncUnreadBadge');
    const user = App.getUser();
    const canWrite = user && user.status === '啟用';

    if (!dashData) {
      box.innerHTML = '<div class="empty-state">讀取通知中心中...</div>';
      return;
    }

    const anns = dashData.announcements || [];
    const notifs = dashData.notifications || [];
    const unreadAnn = anns.filter(a => a.isRead === false).length;
    const unreadNotif = notifs.filter(n => !n.read).length;
    const totalUnread = unreadAnn + unreadNotif;

    if (totalUnread > 0) {
      badge.textContent = `${totalUnread} 則未讀`;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    let html = '';

    // 若管理員有待審核的刪除帳號申請，於通知中心最上方顯示醒目提醒
    if (user && user.role === 'Admin' && dashData.pendingDeletionCount > 0) {
      html += `
        <div class="alert alert-warning" style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
          <span>🗑️ 目前有 <strong>${dashData.pendingDeletionCount} 筆</strong> 成員帳號刪除申請等待審核</span>
          <a href="settings.html#accounts" class="btn btn-warning btn-sm">前往審核 →</a>
        </div>
      `;
    }

    // 區塊一：家庭公告
    html += `<div class="nc-section-title"><span>📢 家庭公告（${anns.length}）</span>${unreadAnn > 0 ? `<span class="text-primary">${unreadAnn} 則未讀</span>` : ''}</div>`;
    if (anns.length === 0) {
      html += `<div class="empty-state" style="padding:18px 10px;">目前沒有家庭公告，點擊上方按鈕即可發布。</div>`;
    } else {
      html += anns.map(a => {
        const isPinned = a.priority === '置頂';
        const isUnread = a.isRead === false;
        const canEdit = canWrite && (user.role === 'Admin' || a.authorId === user.userId);
        const namesHint = (a.readByNames && a.readByNames.length > 0)
          ? `已讀 ${a.readCount}${a.activeMemberCount ? '/' + a.activeMemberCount : ''} 人（${App.escapeHtml(a.readByNames.join('、'))}）`
          : '尚無已讀紀錄';

        return `
          <div class="nc-item ${isPinned ? 'pinned' : ''} ${isUnread ? 'unread' : ''}">
            <div class="ann-meta" style="margin-bottom:6px;">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                ${isUnread ? '<span class="nc-unread-dot" title="未讀"></span>' : ''}
                ${isPinned ? '<span class="badge badge-primary">📌 置頂</span>' : '<span class="badge badge-muted">公告</span>'}
                <strong>${App.escapeHtml(a.authorName)}</strong>
                <span class="text-muted" style="font-size:0.78rem;">${App.escapeHtml(a.createdAt)}</span>
              </div>
              ${canEdit ? `
                <div style="display:flex; gap:4px;">
                  <button type="button" class="btn btn-ghost btn-sm" onclick="openAnnModal('${a.id}')">編輯</button>
                  <button type="button" class="btn btn-ghost btn-sm text-danger" onclick="archiveAnn('${a.id}')">封存</button>
                </div>
              ` : ''}
            </div>
            <div class="ann-content">${App.escapeHtml(a.content)}</div>
            <div class="nc-read-footer">
              <span>${namesHint}</span>
              ${isUnread
                ? `<button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px; font-size:0.76rem;" onclick="markAnnouncementRead('${a.id}')">✓ 標記已讀</button>`
                : `<span class="text-success" style="font-weight:700;">✓ 我已讀</span>`}
            </div>
          </div>
        `;
      }).join('');
    }

    // 區塊二：系統與帳務通知
    html += `<div class="nc-section-title"><span>🔔 系統與帳務通知（${notifs.length}）</span>${unreadNotif > 0 ? `<span class="text-primary">${unreadNotif} 則未讀</span>` : ''}</div>`;
    if (notifs.length === 0) {
      html += `<div class="empty-state" style="padding:18px 10px;">目前沒有系統推播紀錄。</div>`;
    } else {
      html += notifs.map(n => {
        const isUnread = !n.read;
        return `
          <div class="nc-item nc-item-clickable ${isUnread ? 'unread' : ''}" onclick="handleClickNotification('${n.id}', '${App.escapeHtml(n.path || '')}')">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div style="display:flex; align-items:center; gap:6px; font-weight:700; font-size:0.9rem;">
                ${isUnread ? '<span class="nc-unread-dot"></span>' : ''}
                <span>${App.escapeHtml(n.title)}</span>
              </div>
              <span class="badge ${isUnread ? 'badge-primary' : 'badge-muted'}" style="flex-shrink:0;">${isUnread ? '未讀' : '已讀'}</span>
            </div>
            <div style="font-size:0.86rem; color:var(--text); margin-top:5px; line-height:1.5;">${App.escapeHtml(n.message)}</div>
            <div class="text-muted" style="font-size:0.75rem; margin-top:6px; display:flex; justify-content:space-between;">
              <span>${App.escapeHtml(n.createdAt || '')}</span>
              ${n.path ? '<span class="text-primary">點擊前往 →</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    box.innerHTML = html;
  }

  function applyNotificationCenterUpdate(nc) {
    if (!dashData || !nc) return;
    dashData.announcements = nc.announcements || [];
    dashData.notifications = nc.notifications || [];
    dashData.unreadCount = nc.unreadCount || 0;
    dashData.unreadAnnCount = nc.unreadAnnCount || 0;
    dashData.unreadNotifCount = nc.unreadNotifCount || 0;
    App.setCache('dashboard', dashData);
    CatConcierge.setUnread(dashData.unreadCount);
    renderNotificationCenter();
  }

  async function markAnnouncementRead(id) {
    if (dashData && Array.isArray(dashData.announcements)) {
      const target = dashData.announcements.find(a => a.id === id);
      const user = App.getUser();
      if (target && !target.isRead) {
        target.isRead = true;
        if (user && !target.readByNames.includes(user.displayName)) {
          target.readByNames.push(user.displayName);
          target.readCount = target.readByNames.length;
        }
        dashData.unreadCount = Math.max(0, (dashData.unreadCount || 1) - 1);
        CatConcierge.setUnread(dashData.unreadCount);
        renderNotificationCenter();
      }
    }
    try {
      const res = await App.api('announcement.markRead', { id }, { sync: 'none' });
      applyNotificationCenterUpdate(res.data);
    } catch (err) {
      App.toast(err.message, 'error');
    }
  }

  async function handleClickNotification(id, path) {
    const target = dashData && Array.isArray(dashData.notifications)
      ? dashData.notifications.find(n => n.id === id)
      : null;

    if (target && !target.read) {
      target.read = true;
      dashData.unreadCount = Math.max(0, (dashData.unreadCount || 1) - 1);
      App.setCache('dashboard', dashData);
      CatConcierge.setUnread(dashData.unreadCount);
      renderNotificationCenter();
      try {
        const res = await App.api('notification.markRead', { id }, { sync: 'none' });
        applyNotificationCenterUpdate(res.data);
      } catch {}
    }

    if (path && path !== '/index.html' && path !== 'index.html') {
      closeModal('ncModal');
      window.location.href = path.replace(/^\//, '');
    }
  }

  async function markAllRead() {
    const btn = document.getElementById('ncMarkAllBtn');
    btn.disabled = true;
    try {
      const res = await App.api('notification.markRead', { all: true }, { sync: 'none' });
      applyNotificationCenterUpdate(res.data);
      App.toast('已全部標記為已讀', 'success');
    } catch (err) {
      App.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function clearReadNotifications() {
    const btn = document.getElementById('ncClearReadBtn');
    btn.disabled = true;
    try {
      const res = await App.api('notification.clearRead', {}, { sync: 'none' });
      applyNotificationCenterUpdate(res.data);
      App.toast('已清除所有已讀系統通知', 'success');
    } catch (err) {
      App.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function loadDashboard(isInitialCachePhase) {
    const cached = App.getCache('dashboard');
    if (isInitialCachePhase) {
      if (cached) renderDashboard(cached);
      return;
    }

    const btn = document.getElementById('refreshDashBtn');
    btn.disabled = true;
    btn.textContent = '同步中...';
    try {
      const res = await App.api('dashboard.getSummary', {}, { targets: '.page-container .card' });
      App.setCache('dashboard', res.data);
      renderDashboard(res.data);
    } catch (err) {
      if (!cached) App.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '↻ 立即同步';
    }
  }

  // ==================== 公告操作 ====================
  function openAnnModal(editId = '') {
    const user = App.getUser();
    const defaults = App.getUiDefaults();
    const isEdit = Boolean(editId);

    document.getElementById('annEditId').value = editId;
    document.getElementById('annModalTitle').textContent = isEdit ? '✏️ 編輯公告' : '📢 發布新公告';
    document.getElementById('annSubmitBtn').textContent = isEdit ? '儲存變更' : '發布公告';
    document.getElementById('annPriorityGroup').classList.toggle('hidden', user.role !== 'Admin');
    document.getElementById('annPushGroup').classList.toggle('hidden', isEdit);

    if (isEdit && dashData) {
      const target = (dashData.announcements || []).find(a => a.id === editId);
      if (target) {
        document.getElementById('annContent').value = target.content;
        document.getElementById('annPriority').value = target.priority;
      }
    } else {
      document.getElementById('annContent').value = '';
      document.getElementById('annPriority').value = '一般';
      document.getElementById('annNotifyPush').checked = Boolean(defaults.notifyOnAnnouncement);
    }

    document.getElementById('annModal').classList.add('open');
  }

  document.getElementById('annForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('annEditId').value;
    const content = document.getElementById('annContent').value.trim();
    const priority = document.getElementById('annPriority').value;
    const notifyPush = document.getElementById('annNotifyPush').checked;
    const btn = document.getElementById('annSubmitBtn');
    const user = App.getUser();

    btn.disabled = true;
    try {
      if (id) {
        const payload = { id, content };
        if (user.role === 'Admin') payload.priority = priority;
        await App.api('announcement.update', payload, { syncText: '儲存公告變更中…' });
        App.toast('公告已更新', 'success');
      } else {
        await App.api('announcement.create', { content, priority, notifyPush });
        App.toast('公告已發布' + (notifyPush ? '並發送推播' : ''), 'success');
      }
      closeModal('annModal');
      await loadDashboard(false);
    } catch (err) {
      App.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  async function archiveAnn(id) {
    if (!confirm('確定要將這則公告封存移出通知中心嗎？（封存後仍可在設定頁查閱）')) return;

    const prevSnapshot = dashData ? JSON.parse(JSON.stringify(dashData)) : null;
    if (dashData && Array.isArray(dashData.announcements)) {
      dashData.announcements = dashData.announcements.filter(a => a.id !== id);
      dashData.unreadCount = dashData.announcements.filter(a => a.isRead === false).length
        + (dashData.notifications || []).filter(n => !n.read).length;
      App.setCache('dashboard', dashData);
      renderDashboard(dashData);
    }

    try {
      await App.api('announcement.update', { id, status: '已封存' }, { sync: 'none' });
      App.toast('公告已封存', 'success');
    } catch (err) {
      if (prevSnapshot) {
        dashData = prevSnapshot;
        App.setCache('dashboard', prevSnapshot);
        renderDashboard(prevSnapshot);
      }
      App.toast('封存失敗，已還原：' + err.message, 'error');
    }
  }

  // ==================== 瓦斯快速操作 ====================
  function openGasSwitchModal() {
    document.getElementById('gasSwitchNote').value = '';
    document.getElementById('gasSwitchModal').classList.add('open');
  }

  function openGasRefillModal() {
    document.getElementById('gasRefillNote').value = '';
    document.getElementById('gasAddExpenseCheck').checked = false;
    document.getElementById('gasExpenseFields').classList.add('hidden');
    document.getElementById('gasExpenseMonth').value = (dashData && dashData.financeOverview)
      ? dashData.financeOverview.currentMonth
      : App.getCurrentMonthStr();
    document.getElementById('gasExpenseAmount').value = '';
    document.getElementById('gasRefillModal').classList.add('open');
  }

  function toggleGasExpenseFields() {
    const checked = document.getElementById('gasAddExpenseCheck').checked;
    document.getElementById('gasExpenseFields').classList.toggle('hidden', !checked);
  }

  document.getElementById('gasSwitchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gasSwitchBtn');
    const note = document.getElementById('gasSwitchNote').value.trim();
    btn.disabled = true;
    btn.textContent = '記錄中...';
    try {
      await App.api('gas.switchBackup', { note });
      App.toast('已記錄切換至備用桶並通知全員！', 'success');
      closeModal('gasSwitchModal');
      loadDashboard(false);
    } catch (err) {
      App.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '確認換桶並通知';
    }
  });

  document.getElementById('gasRefillForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gasRefillBtn');
    const note = document.getElementById('gasRefillNote').value.trim();
    const addExp = document.getElementById('gasAddExpenseCheck').checked;
    const payload = { note };

    if (addExp) {
      const amount = Number(document.getElementById('gasExpenseAmount').value);
      const month = document.getElementById('gasExpenseMonth').value.trim();
      if (!month || !amount || amount <= 0) {
        return App.toast('請填寫有效的入帳月份與瓦斯金額', 'error');
      }
      payload.createExpense = {
        enabled: true,
        month,
        item: '瓦斯費',
        amount,
        paidByUserId: App.getUser().userId
      };
    }

    btn.disabled = true;
    btn.textContent = '更新中...';
    try {
      await App.api('gas.refillFull', payload);
      App.toast('已更新為 2 桶滿載並通知全員！', 'success');
      closeModal('gasRefillModal');
      loadDashboard(false);
    } catch (err) {
      App.toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '確認補滿 2 桶';
    }
  });

  document.getElementById('ncModal').addEventListener('click', (e) => {
    if (e.target.id === 'ncModal') closeModal('ncModal');
  });

  window.addEventListener('mmh:authSynced', (ev) => {
    renderWelcome(ev.detail);
    if (dashData) renderDashboard(dashData);
  });

  window.addEventListener('mmh:foregroundPush', () => {
    loadDashboard(false);
  });

  App.boot('index', (user, isCachedPhase) => {
    renderWelcome(user);
    loadDashboard(isCachedPhase);
  });
</script>
</body>
</html>
