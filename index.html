<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐈 MayMayHome公費結算系統</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* 橫幅 Banner 樣式 */
        .banner-container {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 70% 35%; /* 可自行調整左右或上下對齊，如 20% 35% */
        }
        
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 15px 0 25px 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap; /* 允許元素換行 */
        }
        .controls label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .controls select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            min-width: 150px;
            cursor: pointer;
        }
        .controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto; /* 表格太寬時允許左右滑動 */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            white-space: nowrap; /* 強制文字不換行，保持表格整齊 */
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            text-align: center;
        }
        th {
            background-color: #f1f1f1;
            font-weight: bold;
        }
        .total-amount {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.15rem;
        }
        #loading {
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.2rem;
            margin: 20px 0;
            display: none;
        }

        /* ====== 手機自適應版面 (RWD) ====== */
        @media (max-width: 768px) {
            body {
                padding: 10px; /* 縮小手機版邊距 */
            }
            .banner-container {
                height: 140px; /* 手機版橫幅變矮，避免佔據太多空間 */
            }
            h1 {
                font-size: 1.5rem; /* 縮小標題 */
                margin: 10px 0 15px 0;
            }
            h2 {
                font-size: 1.25rem;
            }
            .controls {
                flex-direction: column; /* 改為上下排列 */
                align-items: stretch; /* 讓內容填滿寬度 */
                padding: 15px;
            }
            .controls label {
                text-align: center;
            }
            .controls select, .controls button {
                width: 100%; /* 下拉選單與按鈕滿版，方便觸控 */
                font-size: 1.1rem;
                padding: 12px;
            }
            .card {
                padding: 15px;
            }
            th, td {
                padding: 10px 8px; /* 稍微縮小表格內距 */
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="banner-container">
        <img src="littlemaymay.png" alt="MayMay Banner" class="banner-img">
    </div>
    
    <h1>🐈 MayMayHome公費結算系統</h1>
    
    <div class="controls">
        <label for="monthSelect">選擇查看月份：</label>
        <select id="monthSelect" onchange="fetchData()"></select>
        <button onclick="fetchData()">重新整理</button>
    </div>

    <div id="loading">讀取與計算中，請稍候...</div>

    <div id="output" style="display: none;">
        <div class="card">
            <h2>這個月支出明細</h2>
            <div id="expensesTable"></div>
        </div>

        <div class="card">
            <h2>成員本月結算明細</h2>
            <div id="membersTable"></div>
        </div>
    </div>
</div>

<script>
    // 固定的 Google 試算表 ID
    const SPREADSHEET_ID = '13EYAH1ynGnraSEvDLZ0vo8YWsbvtntf0OHU5iCuTLWE';

    // 初始化月份下拉選單 (產生最近24個月的選項)
    function initMonths() {
        const select = document.getElementById('monthSelect');
        const today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth() + 1;

        for (let i = 0; i < 24; i++) {
            const option = document.createElement('option');
            const val = `${year}.${month}`;
            option.value = val;
            option.textContent = `${year} 年 ${month} 月`;
            select.appendChild(option);

            month--;
            if (month === 0) {
                month = 12;
                year--;
            }
        }

        // 自動加載最新月份的資料
        fetchData();
    }

    // CSV 解析器
    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        return lines.map(line => {
            const row = [];
            let curr = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        curr += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(curr.trim());
                    curr = '';
                } else {
                    curr += char;
                }
            }
            row.push(curr.trim());
            return row;
        });
    }

    async function fetchData() {
        const baseSheetName = document.getElementById('monthSelect').value;
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('output').style.display = 'none';

        // 自動產生多種可能的分頁名稱排列（例如：同時嘗試 "2025.9" 與 "2025.09"）
        let namesToTry = [baseSheetName];
        const parts = baseSheetName.split('.');
        if (parts.length === 2) {
            const y = parts[0];
            const m = parts[1];
            if (m.length === 1) {
                namesToTry.push(`${y}.0${m}`); // 補零備用
            } else if (m.length === 2 && m.startsWith('0')) {
                namesToTry.push(`${y}.${parseInt(m, 10)}`); // 去零備用
            }
        }

        let csvText = "";
        let finalSuccessName = "";

        // 輪流嘗試，只要有一個成功抓到資料就停下來
        for (let name of namesToTry) {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
            try {
                const response = await fetch(url);
                if (!response.ok) continue;
                const text = await response.text();
                
                // 如果回傳包含 HTML 結構，代表 Google 導向了錯誤或登入頁面，視同失敗
                if (text.toLowerCase().includes("<html")) continue;
                
                csvText = text;
                finalSuccessName = name;
                break; 
            } catch (e) {
                // 發生連線錯誤則繼續嘗試下一個格式
            }
        }

        if (!csvText) {
            document.getElementById('loading').style.display = 'none';
            alert(`找不到月份資料。\n請確認試算表中是否存在分頁 [${namesToTry.join('] 或 [')}]，且共用權限已開放為「知道連結的使用者皆可查看」。`);
            return;
        }

        processCSV(csvText);
        document.getElementById('loading').style.display = 'none';
    }

    function processCSV(csvText) {
        const rows = parseCSV(csvText);
        
        let expenses = [];
        let totalShared = 0;
        let totalElec = 0;
        let advMap = {};
        
        let members = [];
        let sumDays = 0;
        let sumElecDays = 0;

        for (let i = 1; i < rows.length; i++) {
            let row = rows[i];
            if (!row || row.join('') === '') continue;

            // --- B:D 欄支出明細解析 ---
            let item = row[1] || "";
            let priceStr = row[2] || "";
            let paidBy = row[3] || "";
            let price = parseFloat(priceStr.replace(/,/g, ''));

            if (item && !isNaN(price) && price > 0) {
                expenses.push({ item, price, paidBy });
                
                if (item.startsWith("電費")) {
                    totalElec += price;
                } else {
                    totalShared += price;
                }
                
                if (paidBy) {
                    advMap[paidBy] = (advMap[paidBy] || 0) + price;
                }
            }

            // --- F:J 欄成員計算區域解析 ---
            let memberName = row[5] || "";
            if (memberName) {
                let rent = parseFloat(row[6]) || 0;
                let days = parseFloat(row[7]) || 0;
                let elecDays = parseFloat(row[9]) || 0;

                sumDays += days;
                sumElecDays += elecDays;

                members.push({ memberName, rent, days, elecDays });
            }
        }

        // --- 網頁獨立計算邏輯 ---
        let verificationResults = members.map(m => {
            let sharePct = sumDays > 0 ? (m.days / sumDays) : 0;
            let elecPct = sumElecDays > 0 ? (m.elecDays / sumElecDays) : 0;

            let shareCost = totalShared * sharePct;
            let elecCost = totalElec * elecPct;
            let advanced = advMap[m.memberName] || 0;

            let calculatedK = Math.round(m.rent + shareCost + elecCost - advanced);

            return {
                ...m,
                shareCost: Math.round(shareCost),
                elecCost: Math.round(elecCost),
                advanced,
                calculatedK
            };
        });

        renderUI(expenses, verificationResults);
    }

    function renderUI(expenses, verificationResults) {
        let expHtml = `
            <table>
                <tr>
                    <th>項目</th>
                    <th>總價</th>
                    <th>代墊人</th>
                </tr>
        `;
        if(expenses.length === 0) {
            expHtml += `<tr><td colspan="3">這個月沒有公費支出明細</td></tr>`;
        } else {
            expenses.forEach(e => {
                expHtml += `
                    <tr>
                        <td>${e.item}</td>
                        <td>${e.price.toLocaleString()} 元</td>
                        <td>${e.paidBy || '-'}</td>
                    </tr>
                `;
            });
        }
        expHtml += `</table>`;
        document.getElementById('expensesTable').innerHTML = expHtml;

        let memHtml = `
            <table>
                <tr>
                    <th>成員</th>
                    <th>自訂房租</th>
                    <th>公費分擔</th>
                    <th>電費分擔</th>
                    <th>代墊扣除</th>
                    <th>本月應繳合計</th>
                </tr>
        `;
        if(verificationResults.length === 0) {
            memHtml += `<tr><td colspan="6">未偵測到成員清單</td></tr>`;
        } else {
            verificationResults.forEach(m => {
                memHtml += `
                    <tr>
                        <td><strong>${m.memberName}</strong></td>
                        <td>${m.rent.toLocaleString()} 元</td>
                        <td>+ ${m.shareCost.toLocaleString()} 元</td>
                        <td>+ ${m.elecCost.toLocaleString()} 元</td>
                        <td>- ${m.advanced.toLocaleString()} 元</td>
                        <td class="total-amount">${m.calculatedK.toLocaleString()} 元</td>
                    </tr>
                `;
            });
        }
        memHtml += `</table>`;
        document.getElementById('membersTable').innerHTML = memHtml;

        document.getElementById('output').style.display = 'block';
    }

    window.onload = initMonths;
</script>

</body>
</html>
