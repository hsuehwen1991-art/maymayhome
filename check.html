<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐈 MayMayHome公費與驗算系統</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .banner-container {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 35%;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin: 15px 0 25px 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        
        /* 調整控制列的排版：左右分開 */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between; /* 讓內容往左右兩側對齊 */
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .controls-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        /* 結算日期標籤樣式 */
        .settlement-date {
            font-weight: bold;
            font-size: 1.1rem;
            color: #d9534f;
            background-color: #fce8e6;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
        }

        .controls label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .controls select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            min-width: 150px;
            cursor: pointer;
        }
        .controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            text-align: center;
        }
        th {
            background-color: #f1f1f1;
            font-weight: bold;
        }
        .diff-ok {
            color: #28a745;
            font-weight: bold;
        }
        .diff-warn {
            color: #dc3545;
            font-weight: bold;
        }
        #loading {
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.2rem;
            margin: 20px 0;
            display: none;
        }

        /* 手機自適應版面 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .banner-container { height: 140px; }
            h1 { font-size: 1.5rem; margin: 10px 0 15px 0; }
            h2 { font-size: 1.25rem; }
            .controls { flex-direction: column; align-items: stretch; padding: 15px; }
            .controls-left { flex-direction: column; align-items: stretch; }
            .controls label { text-align: center; }
            .controls select, .controls button { width: 100%; font-size: 1.1rem; padding: 12px; }
            .settlement-date { text-align: center; margin-top: 5px; }
            .card { padding: 15px; }
            th, td { padding: 10px 8px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="banner-container">
        <img src="littlemaymay.jpg" alt="MayMay Banner" class="banner-img">
    </div>
    
    <h1>🐈 MayMayHome公費與驗算系統</h1>
    
    <div class="controls">
        <div class="controls-left">
            <label for="monthSelect">選擇查看月份：</label>
            <select id="monthSelect" onchange="fetchData()"></select>
            <button onclick="fetchData()">重新整理</button>
        </div>
        <!-- 這是新增的結算日期區塊 -->
        <div id="settlementDate" class="settlement-date">結算日期：讀取中...</div>
    </div>

    <div id="loading">讀取與計算中，請稍候...</div>

    <div id="output" style="display: none;">
        <div class="card">
            <h2>這個月支出明細 (B:D欄)</h2>
            <div id="expensesTable"></div>
        </div>

        <div class="card">
            <h2>成員結算與網頁驗算比對 (F:K欄)</h2>
            <div id="membersTable"></div>
        </div>
    </div>
</div>

<script>
    const SPREADSHEET_ID = '13EYAH1ynGnraSEvDLZ0vo8YWsbvtntf0OHU5iCuTLWE';

    function parseCSV(text) {
        const lines = text.split(/\r?\n/);
        return lines.map(line => {
            const row = [];
            let curr = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        curr += '"'; i++;
                    } else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) {
                    row.push(curr.trim()); curr = '';
                } else { curr += char; }
            }
            row.push(curr.trim());
            return row;
        });
    }

    async function initMonths() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').textContent = '正在同步分頁清單...';

        const select = document.getElementById('monthSelect');
        select.innerHTML = ''; 
        
        let useFallback = false;
        const indexUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('目錄')}&t=${Date.now()}`;
        
        try {
            const response = await fetch(indexUrl);
            if (!response.ok) throw new Error("網路請求失敗");
            const csvText = await response.text();
            
            const rows = parseCSV(csvText);
            if (rows.length === 0 || rows[0][0].trim() !== "月份") {
                useFallback = true;
            } else {
                let added = 0;
                for (let i = 1; i < rows.length; i++) {
                    let val = rows[i][0] ? rows[i][0].trim() : "";
                    if (val) {
                        const option = document.createElement('option');
                        option.value = val;
                        let textDisplay = val;
                        if(val.includes('.')) {
                            let parts = val.split('.');
                            textDisplay = `${parts[0]} 年 ${parseInt(parts[1], 10)} 月`;
                        }
                        option.textContent = textDisplay;
                        select.appendChild(option);
                        added++;
                    }
                }
                if (added === 0) useFallback = true;
            }
        } catch (e) {
            useFallback = true;
        }

        if (useFallback) {
            const today = new Date();
            today.setMonth(today.getMonth() - 1); 
            let year = today.getFullYear();
            let month = today.getMonth() + 1;

            for (let i = 0; i < 24; i++) {
                const option = document.createElement('option');
                const mZero = month < 10 ? `0${month}` : `${month}`;
                const val = `${year}.${mZero}`; 
                option.value = val;
                option.textContent = `${year} 年 ${month} 月`;
                select.appendChild(option);

                month--;
                if (month === 0) { month = 12; year--; }
            }
        }

        document.getElementById('loading').textContent = '讀取與計算中，請稍候...';
        fetchData(); 
    }

    // --- 自動計算當月結算日期的函數 ---
    function updateSettlementDate(sheetName) {
        if (!sheetName || !sheetName.includes('.')) {
            document.getElementById('settlementDate').textContent = '結算日期：-';
            return;
        }
        
        // 將 "2026.06" 拆分成 年份 與 月份
        const parts = sheetName.split('.');
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10);
        
        // JavaScript 的 Date(year, month, 0) 可以完美取得該月最後一天的日期數字 (例如 30 還是 31)
        const lastDay = new Date(year, month, 0).getDate();
        
        // 補零讓排版整齊
        const mZero = month < 10 ? `0${month}` : `${month}`;
        const dZero = lastDay < 10 ? `0${lastDay}` : `${lastDay}`;
        
        document.getElementById('settlementDate').textContent = `結算日期：${year} / ${mZero} / ${dZero}`;
    }

    async function fetchData() {
        if(!document.getElementById('monthSelect').value) return; 
        const sheetName = document.getElementById('monthSelect').value;
        
        // 呼叫計算日期的功能
        updateSettlementDate(sheetName);
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('output').style.display = 'none';

        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("網路連線錯誤");
            
            const csvText = await response.text();
            
            if (csvText.toLowerCase().includes("<html") || csvText.includes("CANNOT_FIND_SHEET")) {
                throw new Error(`找不到分頁 [${sheetName}]。\n請確認雲端試算表中是否有這個月份的分頁，且權限已公開。`);
            }

            processCSV(csvText);
        } catch (error) {
            alert(error.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function processCSV(csvText) {
        const rows = parseCSV(csvText);
        
        let expenses = [];
        let totalShared = 0;
        let totalElec = 0;
        let advMap = {};
        
        let members = [];
        let sumDays = 0;
        let sumElecDays = 0;

        for (let i = 1; i < rows.length; i++) {
            let row = rows[i];
            if (!row || row.join('') === '') continue;

            let item = row[1] || "";
            let priceStr = row[2] || "";
            let paidBy = row[3] || "";
            let price = parseFloat(priceStr.replace(/,/g, ''));

            if (item && !isNaN(price) && price > 0) {
                expenses.push({ item, price, paidBy });
                if (item.startsWith("電費")) totalElec += price;
                else totalShared += price;
                if (paidBy) advMap[paidBy] = (advMap[paidBy] || 0) + price;
            }

            let memberName = row[5] || "";
            if (memberName) {
                let rent = parseFloat(row[6]) || 0;
                let days = parseFloat(row[7]) || 0;
                let elecDays = parseFloat(row[9]) || 0;
                let csvK = parseFloat(row[10] ? row[10].replace(/,/g, '') : 0) || 0;

                sumDays += days;
                sumElecDays += elecDays;
                members.push({ memberName, rent, days, elecDays, csvK });
            }
        }

        let verificationResults = members.map(m => {
            let sharePct = sumDays > 0 ? (m.days / sumDays) : 0;
            let elecPct = sumElecDays > 0 ? (m.elecDays / sumElecDays) : 0;

            let shareCost = totalShared * sharePct;
            let elecCost = totalElec * elecPct;
            let advanced = advMap[m.memberName] || 0;

            let calculatedK = Math.round(m.rent + shareCost + elecCost - advanced);
            let diff = calculatedK - m.csvK;

            return {
                ...m,
                shareCost: Math.round(shareCost),
                elecCost: Math.round(elecCost),
                advanced,
                calculatedK,
                diff
            };
        });

        renderUI(expenses, verificationResults);
    }

    function renderUI(expenses, verificationResults) {
        let expHtml = `
            <table>
                <tr>
                    <th>項目</th>
                    <th>總價</th>
                    <th>代墊人</th>
                </tr>
        `;
        if(expenses.length === 0) {
            expHtml += `<tr><td colspan="3">這個月沒有公費支出明細</td></tr>`;
        } else {
            expenses.forEach(e => {
                expHtml += `
                    <tr>
                        <td>${e.item}</td>
                        <td>${e.price.toLocaleString()} 元</td>
                        <td>${e.paidBy || '-'}</td>
                    </tr>
                `;
            });
        }
        expHtml += `</table>`;
        document.getElementById('expensesTable').innerHTML = expHtml;

        let memHtml = `
            <table>
                <tr>
                    <th>成員</th>
                    <th>自訂房租</th>
                    <th>公費分擔</th>
                    <th>電費分擔</th>
                    <th>代墊扣除</th>
                    <th>網頁驗算合計</th>
                    <th>試算表原金額 (K欄)</th>
                    <th>驗算狀態</th>
                </tr>
        `;
        if(verificationResults.length === 0) {
            memHtml += `<tr><td colspan="8">未偵測到成員清單</td></tr>`;
        } else {
            verificationResults.forEach(m => {
                let statusHtml = m.diff === 0 
                    ? `<span class="diff-ok">✓ 數字吻合</span>` 
                    : `<span class="diff-warn">✗ 誤差 ${Math.abs(m.diff)} 元</span>`;

                memHtml += `
                    <tr>
                        <td><strong>${m.memberName}</strong></td>
                        <td>${m.rent.toLocaleString()} 元</td>
                        <td>+ ${m.shareCost.toLocaleString()} 元</td>
                        <td>+ ${m.elecCost.toLocaleString()} 元</td>
                        <td>- ${m.advanced.toLocaleString()} 元</td>
                        <td><strong>${m.calculatedK.toLocaleString()} 元</strong></td>
                        <td>${m.csvK.toLocaleString()} 元</td>
                        <td>${statusHtml}</td>
                    </tr>
                `;
            });
        }
        memHtml += `</table>`;
        document.getElementById('membersTable').innerHTML = memHtml;
        document.getElementById('output').style.display = 'block';
    }

    window.onload = initMonths;
</script>

</body>
</html>
